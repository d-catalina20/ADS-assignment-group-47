services:
  redis:
    image: redis:bullseye
    container_name: ads-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  server_1:
    build:
      context: .
      target: base
    image: ads:lab
    container_name: ads-server-1
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATA_DIR: /app/data
      RPC_PORT: 18861
      SERVER_NAME: server-1
      CACHE_TTL: 300
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 18861), 2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "18861:18861"

  server_2:
    image: ads:lab
    container_name: ads-server-2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATA_DIR: /app/data
      RPC_PORT: 18861
      SERVER_NAME: server-2
      CACHE_TTL: 300
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 18861), 2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "18862:18861"

  server_3:
    image: ads:lab
    container_name: ads-server-3
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATA_DIR: /app/data
      RPC_PORT: 18861
      SERVER_NAME: server-3
      CACHE_TTL: 300
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 18861), 2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "18863:18861"

  loadbalancer:
    build:
      context: .
      target: loadbalancer
    image: ads:loadbalancer
    depends_on:
      server_1:
        condition: service_healthy
      server_2:
        condition: service_healthy
      server_3:
        condition: service_healthy
    environment:
      SERVER_HOSTS: ${SERVER_HOSTS:-server_1:18861,server_2:18861,server_3:18861}
      LOADBALANCER_PORT: 18860
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 18860), 2); s.close()"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "18860:18860"

  client:
    image: ads:lab
    container_name: ads-client
    profiles: ["tools"]
    command: ["python", "/app/client.py"]
    stdin_open: true
    tty: true
    depends_on:
      loadbalancer:
        condition: service_healthy
    environment:
      SERVER_HOST: ${CLIENT_HOST:-loadbalancer}
      SERVER_PORT: ${CLIENT_PORT:-18860}
    volumes:
      - ./client:/app
